<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var realFetch = window.fetch;
          if (realFetch) {
            var patchObj = function (obj) {
              try {
                if (obj) {
                  Object.defineProperty(obj, 'fetch', {
                    get: function () { return realFetch; },
                    set: function (v) { realFetch = v; },
                    configurable: true,
                    enumerable: true
                  });
                }
              } catch (e) {}
            };
            patchObj(Window.prototype);
            patchObj(window);
            if (typeof globalThis !== 'undefined') patchObj(globalThis);
          }
        } catch (e) {}
      })();
    </script>
